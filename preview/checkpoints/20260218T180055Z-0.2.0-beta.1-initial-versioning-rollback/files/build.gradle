plugins {
    id 'base'
}

import java.security.MessageDigest
import groovy.json.JsonOutput

def versionFile = file('VERSION')
def resolvedVersion = versionFile.exists() ? versionFile.text.trim() : '0.2.0-beta.1'
if (!resolvedVersion) {
    throw new GradleException("VERSION file is empty")
}

allprojects {
    group = 'com.upland.connect'
    version = resolvedVersion

    repositories {
        mavenCentral()
    }
}

tasks.register('previewManifest') {
    group = 'build'
    description = 'Regenerates preview artifacts under preview/ using the current converter'
    dependsOn(':afp-cli:generatePreview')
}

tasks.register('versionInfo') {
    group = 'release'
    description = 'Prints the current project version from VERSION'
    doLast {
        println resolvedVersion
    }
}

tasks.register('versionBump', Exec) {
    group = 'release'
    description = 'Bumps VERSION (set VERSION_PART=major|minor|patch|prerelease; optional VERSION_PREID=beta)'
    doFirst {
        String part = (System.getenv('VERSION_PART') ?: '').trim()
        if (!part) {
            throw new GradleException("Missing VERSION_PART. Use major|minor|patch|prerelease.")
        }
        String preid = (System.getenv('VERSION_PREID') ?: 'beta').trim()
        commandLine 'python3',
            'tools/versioning.py',
            '--file', 'VERSION',
            'bump',
            '--part', part,
            '--preid', preid
    }
}

tasks.register('versionStamp') {
    group = 'documentation'
    description = 'Writes preview/version.json from VERSION'
    doLast {
        File out = file('preview/version.json')
        out.parentFile.mkdirs()
        out.text = JsonOutput.prettyPrint(JsonOutput.toJson([
            schemaVersion: '1',
            generatedAt  : new Date().format("yyyy-MM-dd'T'HH:mm:ssXXX"),
            version      : resolvedVersion
        ])) + '\n'
    }
}

tasks.register('projectPlanWorkbook', Exec) {
    group = 'documentation'
    description = 'Updates docs/project-plan-progress.xlsx. Default mode is Excel-native automation; set AFP_WORKBOOK_MODE=xml to use guarded XML updater.'
    dependsOn('projectPlanProgressJson')
    doFirst {
        String mode = ((System.getenv('AFP_WORKBOOK_MODE') ?: 'excel') as String).trim().toLowerCase()
        if (mode == 'xml') {
            List<String> cmd = [
                'python3',
                'tools/update_project_plan_workbook.py',
                '--csv', 'docs/project-plan-progress.csv',
                '--xlsx', 'docs/project-plan-progress.xlsx',
                '--human-approved', 'I_HAVE_EXPLICIT_HUMAN_APPROVAL'
            ]
            File templateZip = file('docs/project-plan-progress.xlsx.zip')
            if (templateZip.exists()) {
                cmd.addAll(['--filter-template', 'docs/project-plan-progress.xlsx.zip'])
            }
            commandLine cmd
            return
        }
        if (mode != 'excel') {
            throw new GradleException("Unsupported AFP_WORKBOOK_MODE='${mode}'. Use 'excel' or 'xml'.")
        }
        commandLine 'python3',
            'tools/run_excel_workbook_refresh.py',
            '--xlsx', 'docs/project-plan-progress.xlsx',
            '--json', 'preview/project-plan-progress-data.json'
    }
}

tasks.register('projectPlanProgressJson', Exec) {
    group = 'documentation'
    description = 'Exports docs/project-plan-progress.csv to preview/project-plan-progress-data.json for Excel-native workbook automation'
    commandLine 'python3',
        'tools/export_project_plan_progress_json.py',
        '--csv', 'docs/project-plan-progress.csv',
        '--json', 'preview/project-plan-progress-data.json'
}

tasks.register('issuesLogTickle', Exec) {
    group = 'documentation'
    description = 'Checks for changes to issue-referenced components and tickles docs/issues-log.csv expectations'
    commandLine 'python3',
        'tools/issues_log_tickle.py',
        '--issues', 'docs/issues-log.csv',
        '--output', 'preview/issues-log-tickle.json',
        '--enforce'
}

tasks.register('issuesEffectivenessReport', Exec) {
    group = 'documentation'
    description = 'Generates mechanized issue-effectiveness signals from issues, progress, and fidelity artifacts'
    dependsOn('issuesLogTickle')
    dependsOn('projectPlanProgressJson')
    dependsOn(':afp-engine:fidelityReport')
    commandLine 'python3',
        'tools/issues_effectiveness_report.py',
        '--issues', 'docs/issues-log.csv',
        '--tickle', 'preview/issues-log-tickle.json',
        '--progress', 'docs/project-plan-progress.csv',
        '--fidelity', 'preview/fidelity-report.json',
        '--output', 'preview/issues-effectiveness.json'
}

def sha256Hex = { File file ->
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = input.read(buffer)) >= 0) {
            digest.update(buffer, 0, read)
        }
    }
    return digest.digest().collect { String.format('%02x', it) }.join()
}

tasks.register('documentationManifest') {
    group = 'documentation'
    description = 'Updates preview/documentation-manifest.json with checksums for changelog and docs files'
    dependsOn('versionStamp')
    dependsOn('previewManifest')
    dependsOn(':afp-engine:fidelityReport')
    dependsOn('projectPlanNextStep')
    dependsOn('projectPlanProgressJson')
    dependsOn('issuesLogTickle')
    dependsOn('issuesEffectivenessReport')
    dependsOn('projectPlanWorkbook')
    doLast {
        File output = file('preview/documentation-manifest.json')
        output.parentFile.mkdirs()
        List<File> tracked = [
            file('AI-POLICY.md'),
            file('README.md'),
            file('docs/API.md'),
            file('docs/project-plan.md'),
            file('SESSION_CHANGELOG.md'),
            file('preview/afp-output.pdf'),
            file('preview/afp-output.html'),
            file('preview/afp-meta.json'),
            file('preview/afp-diag.json'),
            file('preview/fidelity-report.json'),
            file('preview/project-plan-progress-data.json'),
            file('preview/issues-log-tickle.json'),
            file('preview/issues-effectiveness.json'),
            file('preview/project-plan-next-step.json'),
            file('preview/version.json'),
            file('VERSION')
        ]
        tracked.addAll(fileTree('docs') {
            include '**/*.md'
        }.files.findAll { it.name != 'API.md' && it.name != 'project-plan.md' }.sort { a, b -> a.path <=> b.path })
        tracked.addAll(fileTree('docs') {
            include '**/*.csv'
        }.files.sort { a, b -> a.path <=> b.path })
        tracked.addAll(fileTree('docs') {
            include '**/*.xlsx'
        }.files.sort { a, b -> a.path <=> b.path })
        String generatedAt = new Date().format("yyyy-MM-dd'T'HH:mm:ssXXX")
        String entries = tracked.collect { File f ->
            String rel = projectDir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
            String hash = f.exists() ? sha256Hex(f) : ''
            String size = f.exists() ? Long.toString(f.length()) : '0'
            String modified = f.exists() ? new Date(f.lastModified()).format("yyyy-MM-dd'T'HH:mm:ssXXX") : ''
            return "    {\"path\": \"${rel}\", \"exists\": ${f.exists()}, \"sizeBytes\": ${size}, \"sha256\": \"${hash}\", \"lastModified\": \"${modified}\"}"
        }.join(",\n")
        List<String> stages = [
            "generate preview artifacts",
            "run fidelity report",
            "update documentation and changelog checksums",
            "review project plan, scope next phase, and implement the next logical task"
        ]
        String stageEntries = stages.collect { String stage ->
            "    \"${stage}\""
        }.join(",\n")
        output.text =
            "{\n" +
                "  \"schemaVersion\": \"1\",\n" +
                "  \"generatedAt\": \"${generatedAt}\",\n" +
                "  \"stages\": [\n" +
                stageEntries + "\n" +
                "  ],\n" +
                "  \"files\": [\n" +
                entries + "\n" +
                "  ]\n" +
                "}\n"
    }
}

tasks.register('publishCiArtifacts') {
    group = 'verification'
    description = 'Publishes CI-facing artifact bundle under preview/ci-artifacts/latest'
    dependsOn('documentationManifest')
    doLast {
        File outputDir = file('preview/ci-artifacts/latest')
        outputDir.mkdirs()
        List<File> artifacts = [
            file('AI-POLICY.md'),
            file('preview/afp-output.pdf'),
            file('preview/afp-output.html'),
            file('preview/afp-meta.json'),
            file('preview/afp-diag.json'),
            file('preview/fidelity-report.json'),
            file('preview/project-plan-progress-data.json'),
            file('preview/issues-log-tickle.json'),
            file('preview/issues-effectiveness.json'),
            file('preview/documentation-manifest.json'),
            file('preview/project-plan-next-step.json'),
            file('preview/version.json'),
            file('docs/fidelity-corpus.txt'),
            file('docs/project-plan.md'),
            file('docs/project-plan-progress.csv'),
            file('docs/project-plan-progress.xlsx'),
            file('VERSION'),
            file('SESSION_CHANGELOG.md')
        ]
        artifacts.each { File source ->
            if (!source.exists()) {
                return
            }
            File dest = new File(outputDir, source.name)
            dest.bytes = source.bytes
        }
        String generatedAt = new Date().format("yyyy-MM-dd'T'HH:mm:ssXXX")
        List<String> fileEntries = artifacts.collect { File f ->
            File copied = new File(outputDir, f.name)
            if (!copied.exists()) {
                return null
            }
            String originalRel = projectDir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
            String copiedRel = projectDir.toPath().relativize(copied.toPath()).toString().replace('\\', '/')
            return "    {\"source\": \"${originalRel}\", \"artifact\": \"${copiedRel}\", \"sizeBytes\": ${copied.length()}, \"sha256\": \"${sha256Hex(copied)}\"}"
        }.findAll { it != null }
        String filesJson = fileEntries.join(",\n")
        File index = new File(outputDir, 'index.json')
        index.text =
            "{\n" +
                "  \"schemaVersion\": \"1\",\n" +
                "  \"generatedAt\": \"${generatedAt}\",\n" +
                "  \"artifactCount\": ${fileEntries.size()},\n" +
                "  \"files\": [\n" +
                filesJson + "\n" +
                "  ]\n" +
                "}\n"
    }
}

tasks.register('createRollbackCheckpoint', Exec) {
    group = 'release'
    description = 'Creates a rollback checkpoint under preview/checkpoints from current manifest + baseline files'
    dependsOn('documentationManifest')
    doFirst {
        List<String> cmd = [
            'python3',
            'tools/rollback_manager.py',
            '--root', '.',
            '--base', 'preview/checkpoints',
            '--manifest', 'preview/documentation-manifest.json',
            'create'
        ]
        String label = (System.getenv('CHECKPOINT_LABEL') ?: '').trim()
        if (label) {
            cmd.addAll(['--label', label])
        }
        commandLine cmd
    }
}

tasks.register('listRollbackCheckpoints', Exec) {
    group = 'release'
    description = 'Lists available rollback checkpoints'
    commandLine 'python3',
        'tools/rollback_manager.py',
        '--root', '.',
        '--base', 'preview/checkpoints',
        'list'
}

tasks.register('rollbackCheckpoint', Exec) {
    group = 'release'
    description = 'Restores a rollback checkpoint (dry-run by default). Set CHECKPOINT_ID and ROLLBACK_APPLY=true to apply.'
    doFirst {
        String checkpointId = (System.getenv('CHECKPOINT_ID') ?: '').trim()
        if (!checkpointId) {
            throw new GradleException("Missing CHECKPOINT_ID.")
        }
        List<String> cmd = [
            'python3',
            'tools/rollback_manager.py',
            '--root', '.',
            '--base', 'preview/checkpoints',
            'restore',
            '--id', checkpointId
        ]
        String applyFlag = (System.getenv('ROLLBACK_APPLY') ?: '').trim().toLowerCase()
        if (applyFlag == 'true' || applyFlag == '1' || applyFlag == 'yes') {
            cmd.add('--apply')
        }
        commandLine cmd
    }
}

tasks.register('releaseSnapshot') {
    group = 'release'
    description = 'Runs quality gate and creates a rollback checkpoint'
    dependsOn('qualityGate')
    dependsOn('createRollbackCheckpoint')
}

tasks.register('projectPlanNextStep') {
    group = 'documentation'
    description = 'Extracts the next instruction from docs/project-plan.md into preview/project-plan-next-step.json'
    doLast {
        File plan = file('docs/project-plan.md')
        File output = file('preview/project-plan-next-step.json')
        output.parentFile.mkdirs()
        if (!plan.exists()) {
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                schemaVersion: '1',
                generatedAt  : new Date().format("yyyy-MM-dd'T'HH:mm:ssXXX"),
                status       : 'missing-plan',
                message      : 'Missing docs/project-plan.md'
            ])) + '\n'
            return
        }

        List<String> lines = plan.readLines('UTF-8')
        List<Map<String, Object>> actions = []
        List<String> immediateSequence = []
        Map<String, Object> current = null
        boolean inWorkstreams = false
        boolean inTasks = false
        boolean inImmediate = false

        for (String raw : lines) {
            String line = raw == null ? '' : raw.trim()

            if (line == '## Workstreams') {
                inWorkstreams = true
                inImmediate = false
                continue
            }
            if (line == '## Proposed Immediate Next Execution Sequence') {
                inImmediate = true
                inWorkstreams = false
                inTasks = false
                if (current != null) {
                    actions.add(current)
                    current = null
                }
                continue
            }
            if ((inWorkstreams || inImmediate) && line.startsWith('## ')
                && line != '## Workstreams'
                && line != '## Proposed Immediate Next Execution Sequence') {
                if (current != null) {
                    actions.add(current)
                    current = null
                }
                inWorkstreams = false
                inImmediate = false
                inTasks = false
            }

            if (inImmediate) {
                if (line ==~ /^\d+\.\s+.*/) {
                    immediateSequence.add(line.replaceFirst(/^\d+\.\s+/, ''))
                }
                continue
            }

            if (!inWorkstreams) {
                continue
            }
            if (line.startsWith('### ')) {
                if (current != null) {
                    actions.add(current)
                }
                current = [title: line.replaceFirst('^###\\s+', ''), tasks: []]
                inTasks = false
                continue
            }
            if (line.toLowerCase().startsWith('- tasks')) {
                inTasks = true
                continue
            }
            if (line.toLowerCase().startsWith('- objective') || line.toLowerCase().startsWith('- exit criteria')) {
                inTasks = false
                continue
            }
            if (current != null && inTasks && line.startsWith('- ')) {
                List<String> tasks = (List<String>) current.tasks
                tasks.add(line.replaceFirst('^-\\s+', ''))
            }
        }
        if (current != null) {
            actions.add(current)
        }

        Map<String, Object> next
        if (!immediateSequence.isEmpty()) {
            next = [
                title : 'Immediate Next Step',
                task  : immediateSequence.first(),
                source: '## Proposed Immediate Next Execution Sequence'
            ]
        } else if (!actions.isEmpty()) {
            next = actions.first()
        } else {
            next = [:]
        }
        output.text = JsonOutput.prettyPrint(JsonOutput.toJson([
            schemaVersion : '1',
            generatedAt   : new Date().format("yyyy-MM-dd'T'HH:mm:ssXXX"),
            planPath      : 'docs/project-plan.md',
            actionCount   : actions.size(),
            nextInstruction: next,
            actions       : actions,
            immediateSequence: immediateSequence
        ])) + '\n'
    }
}

tasks.named('build') {
    dependsOn('documentationManifest')
}

tasks.register('qualityGate') {
    group = 'verification'
    description = 'Runs tests, fidelity gate, and documentation manifest generation as a release readiness gate'
    dependsOn(':afp-engine:test')
    dependsOn(':afp-engine:fidelityGate')
    dependsOn('documentationManifest')
    dependsOn('publishCiArtifacts')
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.10.2')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}
