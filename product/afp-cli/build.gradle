plugins {
    id 'application'
}

dependencies {
    implementation project(':afp-api')
    implementation project(':afp-engine')
    implementation 'info.picocli:picocli:4.7.6'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.6'
}

application {
    applicationName = 'afp2pdf'
    mainClass = 'solutions.pointzero.symphony.afp.cli.Afp2PdfMain'
}

tasks.named('run') {
    workingDir = rootProject.projectDir
}

tasks.register('cleanPreviewWorkspace', Delete) {
    delete(
        rootProject.file('.tmp/cache-preview'),
        rootProject.file('.tmp/temp-preview'),
        rootProject.file('preview/afp-output.pdf'),
        rootProject.file('preview/afp-output.html'),
        rootProject.file('preview/afp-meta.json'),
        rootProject.file('preview/afp-diag.json')
    )
}

tasks.register('generatePreview', JavaExec) {
    group = 'build'
    description = 'Generates preview PDF/HTML/metadata/diagnostics from sampleData/sample.afp'
    dependsOn tasks.named('classes')
    dependsOn tasks.named('cleanPreviewWorkspace')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    workingDir = rootProject.projectDir
    args(
        '--in', rootProject.file('sampleData/sample.afp').path,
        '--out', rootProject.file('preview/afp-output.pdf').path,
        '--meta', rootProject.file('preview/afp-meta.json').path,
        '--diag', rootProject.file('preview/afp-diag.json').path,
        '--html', rootProject.file('preview/afp-output.html').path,
        '--cacheDir', rootProject.file('.tmp/cache-preview').path,
        '--tempDir', rootProject.file('.tmp/temp-preview').path,
        '--timeoutSeconds', '30',
        '--textFallback', 'SUBSTITUTE'
    )
}

distributions {
    main {
        contents {
            from(rootProject.file('README.md'))
            from(rootProject.file('tools')) {
                into('tools')
            }
        }
    }
}
