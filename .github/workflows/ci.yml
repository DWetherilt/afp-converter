name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate boilerplate packages
        run: |
          for dir in boilerplate/update-packages/pz-boilerplate-intelliJ/*; do
            [ -d "$dir" ] || continue
            tools/validate_boilerplate_package.sh "$dir"
          done
      - name: Recovery quick check
        run: tools/recovery_quick_check.sh
      - name: Production build
        run: ./gradlew --no-daemon prodBuild
      - name: Documentation manifest
        run: ./gradlew --no-daemon documentationManifest
      - name: Upload recovery artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-artifacts
          path: |
            pm/reports/sql-drift-summary.json
            pm/reports/project-plan-progress-data.json
            pm/reports/issues-log-tickle.json
            pm/reports/issues-effectiveness.json
            pm/reports/recovery-status.json
            pm/state/critical-db-sha256.txt
