            file('pm/reports/project-plan-progress-data.json'),
            file('pm/reports/governance-alerts.json'),
            file('pm/reports/version-control-ledger.json'),
            file('pm/reports/issues-log-tickle.json'),
            file('pm/reports/issues-effectiveness.json'),
            file('pm/reports/policy-rules.json'),
            file('pm/reports/policy-rules-lint.json'),
            file('pm/reports/sql-authority-application.json'),
            file('pm/reports/sql-authority-pm.json'),
            file('pm/reports/sql-authority-boilerplate.json'),
            file('pm/reports/sql-coverage-application.json'),
            file('pm/reports/sql-coverage-pm.json'),
            file('pm/reports/sql-coverage-boilerplate.json'),
            file('pm/reports/sql-reconstruction-application.json'),
            file('pm/reports/sql-reconstruction-pm.json'),
            file('pm/reports/sql-reconstruction-boilerplate.json'),
            file('pm/reports/cross-realm-token-search.json'),
            file('pm/reports/data-dictionary.json'),
            file('pm/reports/data-dictionary-lint.json'),
            file('pm/policy/policy-rule-tables.sql'),
            file('pm/reports/repo-file-inventory-with-context.csv'),
            file('pm/reports/boilerplate-package-files-with-context.csv'),
            file('pm/reports/boilerplate-promotion-status.json'),
            file('pm/reports/decision-priority-queue.json'),
            file('pm/reports/knowledge-base.json'),
            file('pm/reports/reasoning-drive.json'),
            file('pm/reports/documentation-manifest.json'),
            file('pm/reports/project-plan-next-step.json'),
            file('pm/reports/workbook-refresh-status.json'),
            file('pm/state/project-state.sqlite'),
            file('pm/state/boilerplate-state.sqlite'),
            file('pm/state/reasoning-experience.sqlite'),
            file('pm/state/reasoning-derived.sqlite'),
            file('pm/state/application-realm.sqlite'),
            file('pm/state/pm-realm.sqlite'),
            file('pm/state/boilerplate-realm.sqlite'),
            file('pm/reports/version.json'),
            file('docs/fidelity-corpus.txt'),
            file('docs/project-plan.md'),
            file('docs/project-plan-progress.csv'),
            file('docs/project-plan-progress.xlsx'),
            file('docs/policy-governance-events.csv'),
            file('docs/policy-governance-events.xlsx'),
            file('docs/boilerplate-sync-candidates.xlsx'),
            file('VERSION'),
            file('SESSION_CHANGELOG.md')
        ]
        artifacts.each { File source ->
            if (!source.exists()) {
                return
            }
            File dest = new File(outputDir, source.name)
            dest.bytes = source.bytes
        }
        String generatedAt = new Date().format("yyyy-MM-dd'T'HH:mm:ssXXX")
        List<String> fileEntries = artifacts.collect { File f ->
            File copied = new File(outputDir, f.name)
            if (!copied.exists()) {
                return null
            }
            String originalRel = projectDir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
            String copiedRel = projectDir.toPath().relativize(copied.toPath()).toString().replace('\\', '/')
            return "    {\"source\": \"${originalRel}\", \"artifact\": \"${copiedRel}\", \"sizeBytes\": ${copied.length()}, \"sha256\": \"${sha256Hex(copied)}\"}"
        }.findAll { it != null }
        String filesJson = fileEntries.join(",\n")
        File index = new File(outputDir, 'index.json')
        index.text =
            "{\n" +
                "  \"schemaVersion\": \"1\",\n" +
                "  \"generatedAt\": \"${generatedAt}\",\n" +
                "  \"artifactCount\": ${fileEntries.size()},\n" +
                "  \"files\": [\n" +
                filesJson + "\n" +
                "  ]\n" +
                "}\n"
    }
}

tasks.register('enforceCiArtifactIndexIncludesPolicyLints') {
    group = 'verification'
    description = 'Fails when CI artifact index omits policy/data dictionary lint reports.'
    dependsOn('publishCiArtifacts')
    doLast {
        File index = file('preview/ci-artifacts/latest/index.json')
        if (!index.exists()) {
            throw new GradleException("Missing CI artifact index: " + index.path)
        }
        String text = index.getText('UTF-8')
        List<String> required = [
            "pm/reports/policy-rules-lint.json",
            "pm/reports/data-dictionary-lint.json"
        ]
        List<String> missing = required.findAll { !text.contains(it) }
        if (!missing.isEmpty()) {
            throw new GradleException("CI artifact index missing required lint reports: " + missing.join(', '))
        }
    }
