tasks.register('enforceProjectBoundaries') {
    group = 'verification'
    description = 'Fails when product modules reference project-management tooling/state.'
    doLast {
        List<String> violations = []
        List<Map<String, Object>> sourceRoots = [
            [module: 'afp-api', dir: file('product/afp-converter/afp-api/src/main/java')],
            [module: 'afp-engine', dir: file('product/afp-converter/afp-engine/src/main/java')],
            [module: 'afp-cli', dir: file('product/afp-converter/afp-cli/src/main/java')]
        ]
        List<Map<String, Object>> forbidden = [
            [pattern: ~/solutions\.pointzero\.symphony\.pm\.tools\./, reason: 'product modules must not reference pm-tools classes'],
            [pattern: ~/preview\/state\//, reason: 'product modules must not reference project-management state databases'],
            [pattern: ~/docs\/policy-governance-events/, reason: 'product modules must not reference governance tracker sources'],
            [pattern: ~/docs\/project-plan-progress/, reason: 'product modules must not reference project-plan tracker sources'],
            [pattern: ~/docs\/boilerplate-sync-candidates/, reason: 'product modules must not reference boilerplate sync trackers']
        ]

        sourceRoots.each { scope ->
            File root = (File) scope.dir
            if (!root.exists()) {
                return
            }
            fileTree(root) {
                include '**/*.java'
            }.files.each { File src ->
                List<String> lines = src.readLines('UTF-8')
                int lineNo = 0
                lines.each { String line ->
                    lineNo++
                    forbidden.each { rule ->
                        if ((line =~ (rule.pattern as java.util.regex.Pattern)).find()) {
                            String rel = projectDir.toPath().relativize(src.toPath()).toString().replace('\\', '/')
                            violations.add("${rel}:${lineNo} -> ${rule.reason}")
                        }
                    }
                }
            }
        }

        List<String> moduleBuilds = ['product/afp-converter/afp-api/build.gradle', 'product/afp-converter/afp-engine/build.gradle', 'product/afp-converter/afp-cli/build.gradle']
        moduleBuilds.each { String path ->
            File f = file(path)
            if (!f.exists()) {
                return
            }
            String text = f.getText('UTF-8')
            if (text.contains("project(':pm-tools')")) {
                violations.add("${path}: disallowed dependency on :pm-tools")
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException("Project boundary violations detected:\n - " + violations.join('\n - '))
        }
    }
}

tasks.register('enforceManagedTooling') {
    group = 'verification'
    description = 'Fails when project-management tooling files are untracked.'
    doLast {
        List<String> roots = [
            'tools',
            'management/pm-management/tools/src/main/java/solutions/pointzero/symphony/management/pm/tools'
        ]
        List<String> unmanaged = []
        roots.each { String root ->
            File dir = file(root)
            if (!dir.exists()) {
                return
            }
            Process process = new ProcessBuilder('git', 'ls-files', '--others', '--exclude-standard', root)
                .directory(projectDir)
                .redirectErrorStream(true)
                .start()
            String stdout = new String(process.inputStream.readAllBytes(), java.nio.charset.StandardCharsets.UTF_8)
            int exit = process.waitFor()
            if (exit != 0) {
                throw new GradleException("Unable to inspect tooling tracking state for root '${root}'")
            }
            List<String> lines = stdout.readLines()
                .collect { it == null ? '' : it.trim() }
                .findAll { !it.isEmpty() }
            unmanaged.addAll(lines)
        }
        if (!unmanaged.isEmpty()) {
            throw new GradleException(
                "Unmanaged project-management tooling detected:\n - " + unmanaged.join('\n - ') +
                    "\nAll tooling under management/tools/ and management/pm-management/tools/.../tools must be version-controlled."
            )
        }
    }
}

tasks.register('enforcePmApplicationRealmSeparation') {
    group = 'verification'
    description = 'Fails when PM artifacts leak into product/afp-converter/preview/ or PM state escapes management/pm/state.'
    doLast {
        List<String> violations = []
        File previewCiArtifactDir = file('product/afp-converter/preview/ci-artifacts')
        if (previewCiArtifactDir.exists()) {
            violations.add("product/afp-converter/preview/ci-artifacts: realm artifact bundles must be ringfenced under management/pm/reports/realm-artifacts/")
        }
        List<String> forbiddenPreviewArtifacts = [
            'product/afp-converter/preview/governance-alerts.json',
            'product/afp-converter/preview/version-control-ledger.json',
            'product/afp-converter/preview/issues-log-tickle.json',
            'product/afp-converter/preview/issues-effectiveness.json',
            'product/afp-converter/preview/project-plan-next-step.json',
            'product/afp-converter/preview/project-plan-progress-data.json',
            'product/afp-converter/preview/workbook-refresh-status.json',
            'product/afp-converter/preview/repo-file-inventory-with-context.csv',
            'product/afp-converter/preview/boilerplate-package-files-with-context.csv',
            'product/afp-converter/preview/documentation-manifest.json',
            'product/afp-converter/preview/version.json'
        ]
        forbiddenPreviewArtifacts.each { String path ->
            if (file(path).exists()) {
                violations.add("${path}: PM artifact must live under management/pm/reports/")
            }
        }

        List<String> forbiddenStateLocations = [
            'product/afp-converter/preview/state/project-state.sqlite',
            'product/afp-converter/preview/state/boilerplate-state.sqlite',
            'project/state/project-state.sqlite',
            'product/boilerplate/state/boilerplate-state.sqlite'
        ]
        forbiddenStateLocations.each { String path ->
            if (file(path).exists()) {
                violations.add("${path}: PM database must live under management/pm/state/")
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException("PM/Application realm separation violations detected:\n - " + violations.join('\n - '))
        }
    }
}

tasks.register('enforceSampleOutputReferenceIntegrity') {
    group = 'verification'
    description = 'Fails when protected sampleOutput reference artifacts are modified or expanded.'
    doLast {
        File manifestFile = file('management/pm/workflow/sample-output-reference-manifest.json')
        if (!manifestFile.exists()) {
            throw new GradleException("Missing sample-output reference manifest: " + manifestFile.path)
        }
        Map manifest = new JsonSlurper().parse(manifestFile) as Map
        List<Map> entries = manifest.entries instanceof List ? (manifest.entries as List<Map>) : []
        if (entries.isEmpty()) {
            throw new GradleException("Sample-output reference manifest has no entries: " + manifestFile.path)
        }

        List<String> violations = []
        Set<String> allowed = new LinkedHashSet<>()
        entries.each { Map entry ->
            String path = (entry.path == null ? '' : entry.path.toString().trim())
            String expectedSha = (entry.sha256 == null ? '' : entry.sha256.toString().trim().toLowerCase(Locale.ROOT))
            if (path.isEmpty() || expectedSha.isEmpty()) {
                violations.add("Invalid manifest entry (missing path/sha256): ${entry}")
                return
            }
            allowed.add(path)
            File target = file(path)
            if (!target.exists()) {
                violations.add("${path}: missing protected reference artifact")
                return
            }
            String actualSha = sha256Hex(target).toLowerCase(Locale.ROOT)
            if (actualSha != expectedSha) {
                violations.add("${path}: sha256 mismatch expected=${expectedSha} actual=${actualSha}")
            }
        }

        File sampleOutputDir = file('product/afp-converter/sampleOutput')
        if (sampleOutputDir.exists()) {
            fileTree(sampleOutputDir).matching {
                include '**/*'
            }.files.findAll { it.isFile() }.each { File f ->
                String rel = projectDir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
                if (!allowed.contains(rel)) {
                    violations.add("${rel}: unexpected file in protected sampleOutput directory")
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException("sampleOutput reference integrity violations detected:\n - " + violations.join('\n - '))
        }
    }
}

tasks.register('enforceBoilerplateRollupForFrameworkChanges') {
    group = 'verification'
    description = 'Fails when framework/process mutations are made without an accompanying boilerplate roll-up package update.'
    doLast {
        def readGitPaths = { List<String> args, String failureMessage ->
            Process proc = new ProcessBuilder(args)
                .directory(projectDir)
                .redirectErrorStream(true)
                .start()
            String out = new String(proc.inputStream.readAllBytes(), java.nio.charset.StandardCharsets.UTF_8)
            int exit = proc.waitFor()
            if (exit != 0) {
                throw new GradleException(failureMessage)
            }
            return out.readLines()
                .collect { it == null ? '' : it.trim() }
                .findAll { !it.isEmpty() }
        }

        Set<String> changed = new LinkedHashSet<>()
        changed.addAll(readGitPaths(['git', 'diff', '--name-only'], 'Unable to inspect unstaged git diff for boilerplate roll-up enforcement.'))
        changed.addAll(readGitPaths(['git', 'diff', '--cached', '--name-only'], 'Unable to inspect staged git diff for boilerplate roll-up enforcement.'))
        changed.addAll(readGitPaths(['git', 'ls-files', '--others', '--exclude-standard'], 'Unable to inspect git untracked files for boilerplate roll-up enforcement.'))

        if (changed.isEmpty()) {
            return
        }

        List<String> frameworkTriggers = [
            'AI-POLICY.md',
            'README.md',
            'build.gradle',
            'settings.gradle',
            'management/pm-management/tools/',
            'management/pm-console/',
            'management/tools/run_excel_workbook_refresh.py',
            'management/tools/issues_effectiveness_report.py',
            'management/pm/policy/'
        ]
        boolean touchedFramework = changed.any { path ->
            frameworkTriggers.any { trigger ->
                path == trigger || path.startsWith(trigger)
            }
        }
        if (!touchedFramework) {
            return
        }

        boolean hasRollupUpdate = changed.any { path ->
            path.startsWith('product/boilerplate/update-packages/pz-boilerplate-intelliJ/')
        }
        if (!hasRollupUpdate) {
            throw new GradleException(
                "Framework/process files changed without boilerplate roll-up update.\n" +
                "Add/update a package under product/boilerplate/update-packages/pz-boilerplate-intelliJ/ in the same change set."
            )
        }
    }
}

tasks.register('enforceNamespaceRoot') {
    group = 'verification'
    description = 'Fails when active source/build/docs reference legacy namespace roots.'
    doLast {
        List<String> scopeRoots = [
            'product/afp-converter/afp-api/src/main/java',
            'product/afp-converter/afp-engine/src/main/java',
            'product/afp-converter/afp-engine/src/test/java',
            'product/afp-converter/afp-cli/src/main/java',
            'management/pm-management/tools/src/main/java',
            'management/pm-console/src/main/java',
            'product/afp-converter/afp-cli/build.gradle',
            'management/pm-console/build.gradle'
        ]
        List<String> violations = []
        scopeRoots.each { String root ->
            File target = file(root)
            if (!target.exists()) {
                return
            }
            if (target.isFile()) {
                String text = target.getText('UTF-8')
                if (text.contains('com.upland.connect') || text.contains('com/upland/connect')) {
                    violations.add("${root}: contains legacy namespace root")
                }
                return
            }
            fileTree(target) {
                include '**/*.java', '**/*.gradle'
            }.files.each { File src ->
                String text = src.getText('UTF-8')
                if (text.contains('com.upland.connect') || text.contains('com/upland/connect')) {
                    String rel = projectDir.toPath().relativize(src.toPath()).toString().replace('\\', '/')
                    violations.add("${rel}: contains legacy namespace root")
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                "Namespace-root violations detected:\n - " + violations.join('\n - ') +
                    "\nRequired root namespace: solutions.pointzero.symphony"
            )
        }
    }
}

