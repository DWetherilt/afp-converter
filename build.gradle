import java.security.MessageDigest
import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.util.Locale

def versionFile = file('VERSION')
def resolvedVersion = versionFile.exists() ? versionFile.text.trim() : '0.2.0-beta.1'
if (!resolvedVersion) {
    throw new GradleException("VERSION file is empty")
}

def pmWorkflowManifestFile = file('management/pm/workflow/workflow-manifest.json')
def pmWorkflowManifest = pmWorkflowManifestFile.exists()
    ? (new JsonSlurper().parse(pmWorkflowManifestFile) as Map)
    : [:]
def pmWorkflowGradleMap = (pmWorkflowManifest?.adapters instanceof Map
    && pmWorkflowManifest.adapters.gradle instanceof Map
    && pmWorkflowManifest.adapters.gradle.phaseTaskMap instanceof Map)
    ? (pmWorkflowManifest.adapters.gradle.phaseTaskMap as Map)
    : [:]
def pmWorkflowDefaults = (pmWorkflowManifest?.defaults instanceof Map)
    ? (pmWorkflowManifest.defaults as Map)
    : [:]
def pathContractFile = file('management/pm/workflow/path-contract.json')
def pathContract = pathContractFile.exists()
    ? (new JsonSlurper().parse(pathContractFile) as Map)
    : [:]
def pathContractPaths = (pathContract?.paths instanceof Map)
    ? (pathContract.paths as Map)
    : [:]
def requiredPathFromContract = { String key ->
    Object raw = pathContractPaths.get(key)
    String value = raw == null ? '' : raw.toString().trim()
    if (value.isEmpty()) {
        throw new GradleException("Missing required path-contract key '${key}' in ${pathContractFile.path}")
    }
    return value
}
def PATHS = [
    projectStateDb      : requiredPathFromContract('projectStateDb'),
    boilerplateStateDb  : requiredPathFromContract('boilerplateStateDb'),
    applicationRealmDb  : requiredPathFromContract('applicationRealmDb'),
    pmRealmDb           : requiredPathFromContract('pmRealmDb'),
    boilerplateRealmDb  : requiredPathFromContract('boilerplateRealmDb'),
    coreRealmDb         : requiredPathFromContract('coreRealmDb')
]
def envGovernanceMode = (System.getenv('ENV_GOVERNANCE_MODE') ?: 'strict').trim().toLowerCase(Locale.ROOT)
def isCiEnvironment = (System.getenv('CI') ?: '').trim().toLowerCase(Locale.ROOT) in ['1', 'true', 'yes']
def pmConsoleAutolaunch = (System.getenv('PM_CONSOLE_AUTOLAUNCH') ?: (isCiEnvironment ? 'false' : 'true')).trim().toLowerCase(Locale.ROOT)

def realmManagedManifestFile = file('management/pm/workflow/realm-managed-manifest.json')
def realmManagedManifest = realmManagedManifestFile.exists()
    ? (new JsonSlurper().parse(realmManagedManifestFile) as Map)
    : [:]
def realmManagedRealms = (realmManagedManifest?.realms instanceof Map)
    ? (realmManagedManifest.realms as Map)
    : [:]
def realmRootsCsv = { String realmId, String fallback ->
    Object realmNode = realmManagedRealms.get(realmId)
    if (!(realmNode instanceof Map)) {
        return fallback
    }
    Object roots = ((Map) realmNode).get('roots')
    if (!(roots instanceof List)) {
        return fallback
    }
    List<String> values = ((List) roots)
        .collect { it == null ? '' : it.toString().trim() }
        .findAll { !it.isEmpty() }
    return values.isEmpty() ? fallback : values.join(',')
}

def resolvePmWorkflowTasks = { String phaseId ->
    Object raw = pmWorkflowGradleMap.get(phaseId)
    if (!(raw instanceof List)) {
        throw new GradleException("No Gradle phase mapping found for PM workflow phase '${phaseId}' in ${pmWorkflowManifestFile.path}")
    }
    List<String> tasks = (raw as List)
        .collect { it == null ? '' : it.toString().trim() }
        .findAll { !it.isEmpty() }
    if (tasks.isEmpty()) {
        throw new GradleException("Empty Gradle task list for PM workflow phase '${phaseId}' in ${pmWorkflowManifestFile.path}")
    }
    return tasks
}

