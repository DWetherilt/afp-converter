tasks.register('applicationRealmSqlAuthorityCheck', Exec) {
    group = 'verification'
    description = 'Verifies application realm files have not drifted from SQL-managed content.'
    dependsOn(':pm-tools:classes')
    doFirst {
        def sourceSets = project(':pm-tools').sourceSets
        String cp = sourceSets.main.runtimeClasspath.asPath
        String strictRaw = (System.getenv('AFP_SQL_AUTH_STRICT') ?: 'true').trim().toLowerCase(Locale.ROOT)
        boolean strict = !(strictRaw in ['0', 'false', 'no'])
        List<String> cmd = [
            'java', '-cp', cp,
            'solutions.pointzero.symphony.pm.tools.StateDatabaseTool',
            'verify-code-realm',
            '--db', 'pm/state/application-realm.sqlite',
            '--realm', 'application',
            '--target-root', '.',
            '--output', 'pm/reports/sql-authority-application.json'
        ]
        if (strict) {
            cmd.add('--enforce')
        }
        commandLine cmd
    }
}

