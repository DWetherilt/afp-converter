tasks.register('projectPlanNextStep') {
    group = 'documentation'
    description = 'Extracts the next instruction from docs/project-plan.md into pm/reports/project-plan-next-step.json'
    doLast {
        File plan = file('docs/project-plan.md')
        File output = file('pm/reports/project-plan-next-step.json')
        output.parentFile.mkdirs()
        if (!plan.exists()) {
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                schemaVersion: '1',
                generatedAt  : new Date().format("yyyy-MM-dd'T'HH:mm:ssXXX"),
                status       : 'missing-plan',
                message      : 'Missing docs/project-plan.md'
            ])) + '\n'
            return
        }

        List<String> lines = plan.readLines('UTF-8')
        List<Map<String, Object>> actions = []
        List<String> immediateSequence = []
        Map<String, Object> current = null
        boolean inWorkstreams = false
        boolean inTasks = false
        boolean inImmediate = false

        for (String raw : lines) {
            String line = raw == null ? '' : raw.trim()

            if (line == '## Workstreams') {
                inWorkstreams = true
                inImmediate = false
                continue
            }
            if (line == '## Proposed Immediate Next Execution Sequence') {
                inImmediate = true
                inWorkstreams = false
                inTasks = false
                if (current != null) {
                    actions.add(current)
                    current = null
                }
                continue
            }
            if ((inWorkstreams || inImmediate) && line.startsWith('## ')
                && line != '## Workstreams'
                && line != '## Proposed Immediate Next Execution Sequence') {
                if (current != null) {
                    actions.add(current)
                    current = null
                }
                inWorkstreams = false
                inImmediate = false
                inTasks = false
            }

            if (inImmediate) {
                if (line ==~ /^\d+\.\s+.*/) {
                    immediateSequence.add(line.replaceFirst(/^\d+\.\s+/, ''))
                }
                continue
            }

            if (!inWorkstreams) {
                continue
            }
            if (line.startsWith('### ')) {
                if (current != null) {
                    actions.add(current)
                }
                current = [title: line.replaceFirst('^###\\s+', ''), tasks: []]
                inTasks = false
                continue
            }
            if (line.toLowerCase().startsWith('- tasks')) {
                inTasks = true
                continue
            }
            if (line.toLowerCase().startsWith('- objective') || line.toLowerCase().startsWith('- exit criteria')) {
                inTasks = false
                continue
            }
            if (current != null && inTasks && line.startsWith('- ')) {
                List<String> tasks = (List<String>) current.tasks
                tasks.add(line.replaceFirst('^-\\s+', ''))
            }
        }
        if (current != null) {
            actions.add(current)
        }

        Map<String, Object> next
        if (!immediateSequence.isEmpty()) {
            next = [
                title : 'Immediate Next Step',
                task  : immediateSequence.first(),
                source: '## Proposed Immediate Next Execution Sequence'
            ]
        } else if (!actions.isEmpty()) {
            next = actions.first()
        } else {
            next = [:]
        }
        output.text = JsonOutput.prettyPrint(JsonOutput.toJson([
            schemaVersion : '1',
            generatedAt   : new Date().format("yyyy-MM-dd'T'HH:mm:ssXXX"),
            planPath      : 'docs/project-plan.md',
            actionCount   : actions.size(),
            nextInstruction: next,
            actions       : actions,
            immediateSequence: immediateSequence
        ])) + '\n'
    }
}

