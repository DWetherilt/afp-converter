tasks.register('pmConsoleCleanupStaleSessions', Exec) {
    group = 'documentation'
    description = 'Finds and optionally cleans stale duplicate background pmconsole live sessions.'
    dependsOn('pmEnvironmentPreflight')
    doFirst {
        boolean applyCleanup = ((System.getenv('PM_CONSOLE_CLEANUP_APPLY') ?: 'false').trim().toLowerCase(Locale.ROOT) in ['1', 'true', 'yes'])
        String stalePolicy = (System.getenv('PM_CONSOLE_STALE_POLICY') ?: 'report').trim().toLowerCase(Locale.ROOT)
        if (stalePolicy == 'clean') {
            applyCleanup = true
        }
        String warnThreshold = (System.getenv('PM_CONSOLE_STALE_WARN_THRESHOLD') ?: '2').trim()
        List<String> cmd = [
            'python3',
            'management/tools/pm_console_cleanup.py',
            '--pid-file', 'management/pm/state/pmconsole-live.pid',
            '--output', 'management/pm/reports/pm-console-stale-cleanup.json',
            '--history', 'management/pm/state/pm-console-stale-history.json',
            '--warn-threshold', warnThreshold
        ]
        if (applyCleanup) {
            cmd.add('--apply')
        }
        commandLine cmd
    }
}

