tasks.register('sqlReconstructionPrepare') {
    group = 'verification'
    description = 'Prepares temporary root for SQL reconstruction checks.'
    doLast {
        File tempRoot = file('build/sql-reconstruction-check')
        if (tempRoot.exists()) {
