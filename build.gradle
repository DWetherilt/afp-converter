tasks.register('versionBump', Exec) {
    group = 'release'
    description = 'Bumps VERSION (set VERSION_PART=major|minor|patch|prerelease; optional VERSION_PREID=beta)'
    doFirst {
        String part = (System.getenv('VERSION_PART') ?: '').trim()
        if (!part) {
            throw new GradleException("Missing VERSION_PART. Use major|minor|patch|prerelease.")
        }
        String preid = (System.getenv('VERSION_PREID') ?: 'beta').trim()
        commandLine 'python3',
            'management/tools/versioning.py',
            '--file', 'VERSION',
            'bump',
            '--part', part,
            '--preid', preid
    }
}

tasks.register('versionStamp') {
    group = 'documentation'
    description = 'Writes management/pm/reports/version.json from VERSION'
    doLast {
        File out = file('management/pm/reports/version.json')
        out.parentFile.mkdirs()
        String generatedAt = new Date().format("yyyy-MM-dd'T'HH:mm:ssXXX")
        String releaseDate = generatedAt.substring(0, 10)
        String releaseOccurrence = '001'
        def prereleaseMatch = (resolvedVersion =~ /.*?(\\d+)$/)
        if (prereleaseMatch.matches()) {
            releaseOccurrence = String.format('%03d', Integer.parseInt(prereleaseMatch.group(1)))
        }
        String releaseName = "Release ${resolvedVersion} (${releaseDate})"
        out.text = JsonOutput.prettyPrint(JsonOutput.toJson([
            schemaVersion: '1',
            generatedAt  : generatedAt,
