}

tasks.register('rollbackCheckpoint', Exec) {
    group = 'release'
    description = 'Restores a rollback checkpoint (dry-run by default). Set CHECKPOINT_ID and ROLLBACK_APPLY=true to apply.'
    doFirst {
        String checkpointId = (System.getenv('CHECKPOINT_ID') ?: '').trim()
        if (!checkpointId) {
            throw new GradleException("Missing CHECKPOINT_ID.")
        }
        List<String> cmd = [
            'python3',
            'tools/rollback_manager.py',
            '--root', '.',
            '--base', 'pm/checkpoints',
            'restore',
            '--id', checkpointId
        ]
        String applyFlag = (System.getenv('ROLLBACK_APPLY') ?: '').trim().toLowerCase()
        if (applyFlag == 'true' || applyFlag == '1' || applyFlag == 'yes') {
            cmd.add('--apply')
        }
        commandLine cmd
    }
}

