tasks.register('realmTokenSearch', Exec) {
    group = 'documentation'
    description = 'Searches SQL token dictionaries for a keyword (set -Prealm=application|pm|boilerplate and -Pkeyword=<token>).'
    dependsOn(':pm-tools:classes')
    dependsOn('realmCodeDatabases')
    doFirst {
        def sourceSets = project(':pm-tools').sourceSets
        String cp = sourceSets.main.runtimeClasspath.asPath
        String realm = (project.findProperty('realm') ?: 'application').toString().trim().toLowerCase(Locale.ROOT)
        String keyword = (project.findProperty('keyword') ?: 'render').toString().trim().toLowerCase(Locale.ROOT)
        Map<String, String> dbByRealm = [
            'application': PATHS.applicationRealmDb,
            'pm'         : PATHS.pmRealmDb,
            'boilerplate': PATHS.boilerplateRealmDb
        ]
        if (!dbByRealm.containsKey(realm)) {
            throw new GradleException("Unsupported realm '${realm}'. Use application|pm|boilerplate.")
        }
        String out = "management/pm/reports/${realm}-realm-token-search.json"
        commandLine 'java',
            '-cp', cp,
            'solutions.pointzero.symphony.pm.tools.StateDatabaseTool',
            'search-code-token',
            '--db', dbByRealm.get(realm),
            '--keyword', keyword,
            '--output', out
    }
}

