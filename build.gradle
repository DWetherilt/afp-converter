tasks.register('projectPlanWorkbook', Exec) {
    group = 'documentation'
    description = 'Updates management/docs/project-plan-progress.xlsx when CSV source changes. Force with AFP_FORCE_WORKBOOK_UPDATE=true. Default mode is POI-based updater; set AFP_WORKBOOK_MODE=excel|xml to use legacy paths.'
    dependsOn('projectPlanProgressJson')
    dependsOn(':pm-tools:classes')
    onlyIf {
        File csv = file('management/docs/project-plan-progress.csv')
        File xlsx = file('management/docs/project-plan-progress.xlsx')
        String forceRaw = (System.getenv('AFP_FORCE_WORKBOOK_UPDATE') ?: '').trim().toLowerCase(Locale.ROOT)
        boolean force = forceRaw == '1' || forceRaw == 'true' || forceRaw == 'yes'
        if (force) {
            logger.lifecycle("projectPlanWorkbook: running because AFP_FORCE_WORKBOOK_UPDATE is set")
            return true
        }
        if (!xlsx.exists()) {
            logger.lifecycle("projectPlanWorkbook: running because workbook is missing")
            return true
        }
        if (!csv.exists()) {
            logger.lifecycle("projectPlanWorkbook: skipping because CSV source is missing")
            return false
        }
        boolean shouldRun = csv.lastModified() > xlsx.lastModified()
        logger.lifecycle(
            "projectPlanWorkbook: " + (shouldRun ? "running" : "skipping")
                + " (csvLastModified=" + csv.lastModified()
                + ", xlsxLastModified=" + xlsx.lastModified() + ")"
        )
        return shouldRun
    }
    doFirst {
        String mode = ((System.getenv('AFP_WORKBOOK_MODE') ?: 'poi') as String).trim().toLowerCase()
        if (mode == 'poi') {
            def sourceSets = project(':pm-tools').sourceSets
            String cp = sourceSets.main.runtimeClasspath.asPath
            List<String> cmd = [
                'java',
                '-cp', cp,
                'solutions.pointzero.symphony.pm.tools.ProjectPlanWorkbookUpdater',
                '--csv', 'management/docs/project-plan-progress.csv',
                '--xlsx', 'management/docs/project-plan-progress.xlsx'
            ]
            File templateZip = file('management/docs/project-plan-progress.xlsx.zip')
            if (templateZip.exists()) {
                cmd.addAll(['--template', 'management/docs/project-plan-progress.xlsx.zip'])
            }
            commandLine cmd
            return
        }
        if (mode == 'xml') {
            List<String> cmd = [
                'python3',
                'management/tools/update_project_plan_workbook.py',
                '--csv', 'management/docs/project-plan-progress.csv',
                '--xlsx', 'management/docs/project-plan-progress.xlsx',
                '--human-approved', 'I_HAVE_EXPLICIT_HUMAN_APPROVAL'
            ]
            File templateZip = file('management/docs/project-plan-progress.xlsx.zip')
            if (templateZip.exists()) {
                cmd.addAll(['--filter-template', 'management/docs/project-plan-progress.xlsx.zip'])
            }
            commandLine cmd
            return
        }
        if (mode != 'excel') {
            throw new GradleException("Unsupported AFP_WORKBOOK_MODE='${mode}'. Use 'poi', 'excel' or 'xml'.")
        }
        commandLine 'python3',
            'management/tools/run_excel_workbook_refresh.py',
            '--xlsx', 'management/docs/project-plan-progress.xlsx',
            '--json', 'management/pm/reports/project-plan-progress-data.json'
    }
}

